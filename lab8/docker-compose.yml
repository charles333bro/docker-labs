version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U user -d mydb"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s

  api:
    build: .
    # Убрали проброс порта 5000 наружу, теперь доступ только через Nginx!
    expose:
      - "5000"
    volumes:
      - .:/app
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/mydb
      JWT_SECRET_KEY: my-super-secret-jwt-key
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./static:/usr/share/nginx/html:ro
    depends_on:
      - api

volumes:
  postgres_data: