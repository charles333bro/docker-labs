events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    server_tokens off; # Скрываем версию Nginx (безопасность)

    # HTTP сервер (перенаправляет на HTTPS)
    server {
        listen 80;
        server_name localhost;
        return 301 https://$host$request_uri;
    }

    # HTTPS сервер
    server {
        listen 443 ssl;
        server_name localhost;

        # Пути к сертификатам (мы сгенерируем их на следующем шаге)
        ssl_certificate /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        # --- БЕЗОПАСНОСТЬ (Заголовки) ---
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # --- 1. РАЗДАЧА СТАТИЧЕСКИХ ФАЙЛОВ ---
        location / {
            root /usr/share/nginx/html;
            index index.html;
        }

        # --- 2. REVERSE PROXY ДЛЯ API ---
        # Все запросы, начинающиеся с /api/, идут на Flask (api:5000)
        location /api/ {
            # Убираем префикс /api/ перед отправкой в Flask
            rewrite ^/api/(.*)$ /$1 break;
            
            proxy_pass http://api:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}