version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U user -d mydb"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s

  api:
    build: .
    ports:
      - "5000:5000"
    volumes:
      - .:/app  # <-- Эта строка связывает твою папку с контейнером
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/mydb
      JWT_SECRET_KEY: my-super-secret-jwt-key
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: